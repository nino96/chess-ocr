name: OCR checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
  native-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r python/requirements-native-test-linux-x86_64.txt
      - run: python -m unittest python/test_native_runtime.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m unittest python/test_dataset_pipeline.py python/test_dataset_reset.py python/test_dataset_server.py python/test_synthetic_job.py python/test_synthetic_effect_reference.py
